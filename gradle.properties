org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# ---------------------------------------------------------------------------
# The single source of truth for the whole project.
# Read by settings.gradle.kts and build.gradle.kts. src/main/resources/fabric.mod.json
# and meteor-addon-list.json are generated from it by every build
# (./gradlew syncModMetadata) - edit values here, never in those two files.
# ---------------------------------------------------------------------------

# Mod
mod_id=trade-aura
mod_name=TradeAura
# mod_version is not here - it comes from the latest vX.Y.Z git tag, see build.gradle.kts.
mod_description=Meteor addon for automating villager trading
mod_author=Dorty
mod_color=225,25,25
maven_group=com.TradeAura
mod_package=com.TradeAura.addon
# Comma-separated mixin config files for fabric.mod.json. Empty = none.
mod_mixins=

# Shown as the module category inside Meteor
category_name=DortyAddons

# Used for the repo link in fabric.mod.json and for MeteorAddon#getRepo()
github_owner=DortyTheGreat
github_repo=TradeAura

# meteoraddons.com - written to meteor-addon-list.json.
# Every Minecraft version a published release works on, one by one: 1.21.4-1.21.11 is not
# understood, list each version. Empty = just minecraft_version below.
supported_versions=26.1.2,1.21.11,1.21.4
# Any of: PvP, Utility, Theme, Render, Movement, Building, World, Misc, QoL, Exploit, Fun, Automation
addon_tags=Automation

# Versions (https://fabricmc.net/develop)
jdk_version=25
# The floor of what this release supports - what it is actually compiled/tested against.
minecraft_version=26.1.2
# Optional ceiling. Leave blank (default): fabric.mod.json depends on ">=minecraft_version" only,
# matching Meteor's own "generally forward-compatible until it isn't" stance.
# Fill in only once you have confirmed where THIS release stops working.
minecraft_version_max=
loader_version=0.19.2
loom_version=1.16-SNAPSHOT

# Meteor (https://github.com/MeteorDevelopment/meteor-client)
meteor_version=26.1.2-SNAPSHOT
