org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# ---------------------------------------------------------------------------
# The single source of truth for the whole project.
# Read by settings.gradle.kts, build.gradle.kts and (through processResources)
# by fabric.mod.json - nothing below is duplicated anywhere else.
# ---------------------------------------------------------------------------

# Mod
mod_id=trade-aura
mod_name=TradeAura
# mod_version is NOT here anymore - it's computed in build.gradle.kts from minecraft_version below
# plus version.properties (version_code/dev_number), which test-addon-prism.bat -dev/-release mutates.
mod_description=Meteor Addon for villager trading automatization
mod_author=Dorty
mod_color=225,25,25
maven_group=com.TradeAura
mod_package=com.TradeAura.addon

# Shown as the module category inside Meteor
category_name=DortyAddons

# Used for the repo link in fabric.mod.json and for MeteorAddon#getRepo()
github_owner=DortyTheGreat
github_repo=TradeAura

# Versions (https://fabricmc.net/develop)
jdk_version=25
# The floor of what this release supports - what it's actually compiled/tested against.
minecraft_version=26.1.2
# Optional ceiling. Leave blank (default): fabric.mod.json depends on ">=minecraft_version" only,
# matching Meteor's own "generally forward-compatible until it isn't" stance - see CHANGELOG.md.
# Fill in only once you've confirmed/decided where THIS version_code's release stops working.
minecraft_version_max=
loader_version=0.19.2
loom_version=1.16-SNAPSHOT

# Meteor (https://github.com/MeteorDevelopment/meteor-client)
meteor_version=26.1.2-SNAPSHOT
